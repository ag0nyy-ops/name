[package]
name = "name-rarity-engine"
version = "0.4.0"
edition = "2021"
license-file = "../LICENSE"
description = "Name rarity scoring from SSA baby names and US Census surnames, compiled to WebAssembly"
repository = "https://github.com/ag0nyy-ops/name"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
